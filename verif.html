<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vérification des comptes rendus</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#14202e;--muted:#566478;--line:#d5dde9;--accent:#0b7285;--ok:#17794e;--crit:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--panel:#111b2c;--ink:#e6edf7;--muted:#93a4bb;--line:#223552;--accent:#22d3ee;--ok:#4ade80;--crit:#f87171}}
*{box-sizing:border-box}body{margin:0;padding:24px 16px;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,'Segoe UI',sans-serif}
main{max-width:820px;margin:0 auto;display:grid;gap:14px}h1{margin:0;font-size:24px}p{margin:0;color:var(--muted)}
textarea{width:100%;min-height:260px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px ui-monospace,Menlo,Consolas,monospace}
button{font:600 14px system-ui;background:var(--accent);color:#fff;border:0;border-radius:7px;padding:9px 14px;cursor:pointer}
.res{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.ok{color:var(--ok)}.ko{color:var(--crit)}
</style></head><body><main>
<h1>Vérification d'un compte rendu</h1>
<p>Collez le compte rendu déposé par un binôme. La page recalcule le code de contrôle à partir du binôme, des scores par mission et de la date. S'il diffère, le texte a été modifié après génération.</p>
<textarea id="r" placeholder="Collez ici le compte rendu complet"></textarea>
<div><button id="go" type="button">Vérifier</button></div>
<div class="res" id="res" hidden></div>
</main>
<script>
const SALT = "CC2026-U7S3-";
const SHA = (() => {
  const primes = []; for (let n = 2; primes.length < 64; n++) { let p = true; for (let i = 0; i < primes.length && primes[i] * primes[i] <= n; i++) if (n % primes[i] === 0) { p = false; break; } if (p) primes.push(n); }
  const frac = x => (x - Math.floor(x));
  const K = primes.map(p => Math.floor(frac(Math.cbrt(p)) * 4294967296) >>> 0);
  const H0 = primes.slice(0, 8).map(p => Math.floor(frac(Math.sqrt(p)) * 4294967296) >>> 0);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  return function (text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    const bitLen = bytes.length * 8; bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    const hi = Math.floor(bitLen / 4294967296), lo = bitLen >>> 0;
    for (let i = 3; i >= 0; i--) bytes.push((hi >>> (i * 8)) & 255);
    for (let i = 3; i >= 0; i--) bytes.push((lo >>> (i * 8)) & 255);
    const h = H0.slice();
    for (let off = 0; off < bytes.length; off += 64) {
      const w = new Array(64);
      for (let i = 0; i < 16; i++) w[i] = ((bytes[off + 4 * i] << 24) | (bytes[off + 4 * i + 1] << 16) | (bytes[off + 4 * i + 2] << 8) | bytes[off + 4 * i + 3]) >>> 0;
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25), ch = (e & f) ^ (~e & g);
        const t1 = (hh + S1 + ch + K[i] + w[i]) >>> 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + mj) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      h[0] = (h[0] + a) >>> 0; h[1] = (h[1] + b) >>> 0; h[2] = (h[2] + c) >>> 0; h[3] = (h[3] + d) >>> 0;
      h[4] = (h[4] + e) >>> 0; h[5] = (h[5] + f) >>> 0; h[6] = (h[6] + g) >>> 0; h[7] = (h[7] + hh) >>> 0;
    }
    return h.map(x => x.toString(16).padStart(8, '0')).join('');
  };
})();
document.getElementById('go').addEventListener('click', () => {
  const t = document.getElementById('r').value, el = document.getElementById('res'); el.hidden = false;
  const g = re => (t.match(re) || [])[1];
  const nm = g(/Binôme : (.*)/), when = g(/Date : (.*)/), code = g(/Code de contrôle : ([0-9A-F]{12})/);
  const sl = (t.match(/Score : .*\((.*?) ;/) || [])[1] || '';
  const sc = [...sl.matchAll(/M(\d) ([\d.,]+)/g)].map(m => String(parseFloat(m[2].replace(',', '.'))));
  if (!nm || !when || !code || sc.length !== 9) { el.innerHTML = '<b class="ko">Format non reconnu.</b> Il manque le binôme, la date, les neuf scores ou le code de contrôle.'; return; }
  const exp = SHA(SALT + nm + '|' + sc.join(',') + '|' + when).slice(0, 12).toUpperCase();
  const tot = sc.reduce((a, b) => a + parseFloat(b), 0);
  el.innerHTML = exp === code
    ? '<b class="ok">Code valide.</b> Binôme : ' + nm.replace(/</g, '&lt;') + ' · total recalculé : <b>' + Math.round(tot * 10) / 10 + ' / 45</b> · note sur 20 : <b>' + Math.round(tot / 45 * 20 * 10) / 10 + '</b>'
    : '<b class="ko">Code invalide.</b> Le texte a été modifié après génération (attendu ' + exp + ', reçu ' + code + ').';
});
</script></body></html>
